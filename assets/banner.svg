<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: #ffffff; text-anchor: middle; animation: float 3s ease-in-out infinite; }
      .subtitle { font: 20px sans-serif; fill: #cccccc; text-anchor: middle; animation: fadeIn 2s ease-in 1; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15" />
  <text x="400" y="90" class="title">Awesome SQL IDE Cloud</text>
  <text x="400" y="130" class="subtitle">Cloud &amp; Web SQL Editors Ecosystem</text>
</svg>
